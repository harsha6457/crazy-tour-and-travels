<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car World</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  overflow-x: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  background: #111;
}

.logo {
  color: gold;
  font-size: 20px;
  font-weight: bold;
}

nav a {
  color: white;
  margin: 8px;
  text-decoration: none;
}

.hero {
  text-align: center;
  padding: 30px 10px;
}

.hero h1 {
  color: gold;
  font-size: 26px;
}

/* TRACK */
.track {
  position: relative;
  height: 250px;
  background: linear-gradient(#111, #1a1a1a);
  overflow: hidden;
}

/* CAR */
.car {
  position: absolute;
  bottom: 40px;
  width: 180px;
  animation: move 4s linear infinite;
}

/* ANIMATION */
@keyframes move {
  0% { left: -200px; transform: rotate(0deg); }
  50% { transform: rotate(-5deg); }
  100% { left: 110%; transform: rotate(0deg); }
}

/* SMOKE */
.smoke {
  position: absolute;
  bottom: 30px;
  width: 10px;
  height: 10px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  animation: smoke 2s infinite;
}

.smoke:nth-child(2){ left: 60px; animation-delay: .3s; }
.smoke:nth-child(3){ left: 90px; animation-delay: .6s; }

@keyframes smoke {
  0% { transform: translateY(0) scale(1); opacity: 0.5; }
  100% { transform: translateY(-60px) scale(2); opacity: 0; }
}

.about {
  padding: 20px;
  background: #1a1a1a;
}
</style>
</head>

<body>

<header>
  <div class="logo">CAR WORLD</div>
  <nav>
    <a href="#">Home</a>
    <a href="#about">About</a>
  </nav>
</header>

<div class="hero">
  <h1>THE FUTURE OF DRIVING</h1>
</div>

<div class="track">

  <img class="car" src="https://i.imgur.com/3ZQ3ZQm.png">

  <div class="smoke"></div>
  <div class="smoke" style="left:60px;"></div>
  <div class="smoke" style="left:90px;"></div>

</div>

<div id="about" class="about">
  <h2>About Us</h2>
  <p>High performance cars with luxury design and speed experience.</p>
</div>

</body>
</html>
